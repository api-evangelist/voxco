      x-operation-id-source: derived
  /Responses/{questionKey}:
    get:
      tags:
      - Responses
      summary: Get the Responses in the specified Question
      description: 'For coded responses the keys of the applied codes are returned for each response.


        These keys can be matched to the keys of the codes returned in a query for the codebook to find the details of each of the applied codes.


        The optional date query parameters are UTC date/time values.


        These should be specified in the form:


        YYYY-MM-DDThh:mm:ss


        Where the hour ranges from 0 to 23. For example:


        2020-02-23T16:05:17


        If the time portion of the date/time value is omitted it is assumed to be 00:00:00 GMT.'
      parameters:
      - name: questionKey
        in: path
        description: The key of the Question, which must be an integer value.
        required: true
        schema:
          type: integer
          format: int32
      - name: includeText
        in: query
        description: "If true, the text of each Response is returned.\n\n            If false or omitted the text is not returned."
        schema:
          type: boolean
          default: false
      - name: status
        in: query
        description: 'If omitted, all Responses for the Question are returned.


          If present, one of these values:

          <ul><li>coded: return only Responses with at least one Code applied.

          </li><li>uncoded: return only Responses with no Code applied.</li></ul>'
        schema:
          type: string
      - name: codedAfter
        in: query
        description: If present, only responses with a code applied on or after the specified date/time are returned.
        schema:
          type: string
          format: date-time
      - name: codedBefore
        in: query
        description: If present, only responses with a code applied before the specified date/time are returned.
        schema:
          type: string
          format: date-time
      - name: loadedAfter
        in: query
        description: If present, only responses loaded on or after the specified date/time are returned.
        schema:
          type: string
          format: date-time
      - name: loadedBefore
        in: query
        description: If present, only responses loaded before the specified date/time are returned.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponsesResponse'
              example:
                responses:
                - rid: 34-22907
                  text: I do not like the red color
                  transcription: null
                  translation: null
                  notes: null
                  codeKeys:
                  - 4978
                  - 886
                - rid: 34-22988
                  text: This is a fantastic product
                  transcription: null
                  translation: null
                  notes: null
                  codeKeys:
                  - 449
                errorMessage: null
      operationId: getResponsesByQuestionKey
      x-operation-id-source: derived
    post:
      tags:
      - Responses
      summary: Add Responses to a Question
      description: 'This operation will add new responses to the specified question, optionally autocoding them. It will never modify existing responses.


        For each QuestionResponse submitted, if the question does not have a response stored in Ascribe with the specified respondent id,


        then the response will be added.


        Otherwise, the Response stored in Ascribe will not be modified. The QuestionResponse submitted will be ignored,


        and any codes that have been applied to the Response will be unchanged.


        This operation allows the use of a Rule Set to modify or veto the Responses submitted, and automatically coding the responses as they are added.'
      parameters:
      - name: questionKey
        in: path
        description: The key of the question, which must be an integer value
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        description: The responses to add
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostResponsesRequest'
            example:
              responses:
              - appliedcodes: null
                segmentcodes: null
                rid: 34-22907
                verbatim: I do not like the red color
                translation: null
                transcription: null
                notes: null
              - appliedcodes: null
                segmentcodes: null
                rid: 34-22988
                verbatim: This is a fantastic product
                translation: null
                transcription: null
                notes: null
              autoCodeTextMatch: false
              autoCodeInputId: false
              autoCodeByRegex: false
          text/json:
            schema:
              $ref: '#/components/schemas/PostResponsesRequest'
            example:
              responses:
              - appliedcodes: null
                segmentcodes: null
                rid: 34-22907
                verbatim: I do not like the red color
                translation: null
                transcription: null
                notes: null
              - appliedcodes: null
                segmentcodes: null
                rid: 34-22988
                verbatim: This is a fantastic product
                translation: null
                transcription: null
                notes: null
              autoCodeTextMatch: false
              autoCodeInputId: false
              autoCodeByRegex: false
          application/*+json:
            schema:
              $ref: '#/components/schemas/PostResponsesRequest'
            example:
              responses:
              - appliedcodes: null
                segmentcodes: null
                rid: 34-22907
                verbatim: I do not like the red color
                translation: null
                transcription: null
                notes: null
              - appliedcodes: null
                segmentcodes: null
                rid: 34-22988
                verbatim: This is a fantastic product
                translation: null
                transcription: null
                notes: null
              autoCodeTextMatch: false
              autoCodeInputId: false
              autoCodeByRegex: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponsesResponse'
              example:
                codebookKey: 86443
                responsesAdded: 2
                existingResponsesUnchanged: 0
                responsesCoded: 0
                responsesCodedByTextMatch: 0
                responsesCodedByInputId: 0
                responsesCodedByRegex: 0
                addedResponses:
                - codes:
                  - codeKey: 200404044
                    description: Red
                  rid: 34-22907
                  verbatim: null
                  translation: null
                  transcription: null
                  notes: null
                - codes: []
                  rid: 34-22988
                  verbatim: null
                  translation: null
                  transcription: null
                  notes: null
                errorMessage: null
      operationId: postResponsesByQuestionKey
      x-operation-id-source: derived
    put:
      tags:
      - Responses
      summary: Add or update Responses in the specified Question
      description: 'If the Question does not have a Response stored in Ascribe with the specified respondent id, then the response will be added.


        Otherwise, the Response stored in Ascribe will be updated if any of the properties of in the request differ from the values of the current properties of the Response.'
      parameters:
      - name: questionKey
        in: path
        description: The key of the Question, which must be an integer value.
        required: true
        schema:
          type: integer
          format: int32
