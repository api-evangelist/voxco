openapi: 3.2.0
info:
  title: Ascribe Coder Responses API
  description: To import this API to Postman, copy the URL from the top of this page.
  contact:
    email: support@goascribe.com
  version: v2
servers:
- url: https://api.goascribe.us/coder/v2
  description: US Servers
- url: https://api.goascribe.eu/coder/v2
  description: EU Servers
- url: https://api-ca.goascribe.com/coder/v2
  description: CA Servers
security:
- Bearer: []
tags:
- name: Responses
paths:
  /Responses/{QuestionKey}/{RespondentID}:
    delete:
      tags:
      - Responses
      summary: Delete a response from the database by using pair of question key and…
      description: Method deletes the response by using question key and respondent id.
      parameters:
      - name: QuestionKey
        in: path
        description: Key of question
        required: true
        schema:
          type: integer
          format: int32
      - name: RespondentID
        in: path
        description: ID of respondent
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponseResponse'
              example:
                errorMessage: null
      operationId: deleteResponsesByQuestionKeyByRespondentID
      x-operation-id-source: derived
  /Responses/Batch:
    delete:
      tags:
      - Responses
      summary: Delete a batch of responses from the database by using pairs of question key…
      description: Method deletes a batch of responses by using pairs of question key and respondent id.
      requestBody:
        description: Array of pairs of question key and respondent id.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteResponsesBatchRequest'
            example:
              questionResponses:
              - questionKey: 55
                respondentIDs:
                - '100001'
                - '100002'
              - questionKey: 56
                respondentIDs:
                - '200001'
              - questionKey: 57
                respondentIDs:
                - '300001'
                - '300002'
                - '300003'
          text/json:
            schema:
              $ref: '#/components/schemas/DeleteResponsesBatchRequest'
            example:
              questionResponses:
              - questionKey: 55
                respondentIDs:
                - '100001'
                - '100002'
              - questionKey: 56
                respondentIDs:
                - '200001'
              - questionKey: 57
                respondentIDs:
                - '300001'
                - '300002'
                - '300003'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DeleteResponsesBatchRequest'
            example:
              questionResponses:
              - questionKey: 55
                respondentIDs:
                - '100001'
                - '100002'
              - questionKey: 56
                respondentIDs:
                - '200001'
              - questionKey: 57
                respondentIDs:
                - '300001'
                - '300002'
                - '300003'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponsesBatchResponse'
              example:
                questionResponses:
                - questionKey: 55
                  respondentID: '100001'
                  errorMessage: null
                - questionKey: 55
                  respondentID: '100002'
                  errorMessage: null
                - questionKey: 56
                  respondentID: '200001'
                  errorMessage: null
                - questionKey: 57
                  respondentID: '300001'
                  errorMessage: 'SQL Exception: Cannot delete. Trigger TR_Responses_BeforeDeleteCheck.'
                - questionKey: 57
                  respondentID: '300002'
                  errorMessage: null
                - questionKey: 57
                  respondentID: '300003'
                  errorMessage: null
                errorMessage: null
