          - 'null'
          description: Id of target question
        updatedResponses:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PutResponseBatch'
          description: Updated responses
        addedResponses:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PutResponseBatch'
          description: Added responses
        unchangedResponses:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PutResponseBatch'
          description: Unchanged responses
        errorMessage:
          type:
          - string
          - 'null'
          description: Error message when updating question responses finished with some error
      additionalProperties: false
      description: Class contains information about updated responses for target questions
    PutResponseBatch:
      required:
      - rid
      type: object
      properties:
        rid:
          minLength: 1
          type: string
          description: 'The respondent id, which is unique among Responses in this Question.


            This id identifies the respondent in the Study, and that respondent''s Response in this Question.'
        verbatim:
          type:
          - string
          - 'null'
          description: 'The verbatim text of the response, in other words the answer the respondent gave to the question posed.


            Required if this is a new respondent, optional if updating an existing response for this respondent.'
        translation:
          type:
          - string
          - 'null'
          description: Optional translation of the verbatim text.
        transcription:
          type:
          - string
          - 'null'
          description: Optional transcription of the response.
        notes:
          type:
          - string
          - 'null'
