components:
  schemas:
    DeleteQuestionResponseResultItem:
      type: object
      properties:
        questionKey:
          type: integer
          description: Key of question
          format: int32
        respondentID:
          type:
          - string
          - 'null'
          description: Respondent ID of response
        errorMessage:
          type:
          - string
          - 'null'
          description: Error message why response can not be deleted
      additionalProperties: false
      description: Result item with information about status of deletion of some response in the specified question
    PutResponsesRequest:
      required:
      - responses
      type: object
      properties:
        responses:
          type: array
          items:
            $ref: '#/components/schemas/PutResponse'
          description: 'The responses to be added or updated.


            All strings in these responses will be trimmed of leading and trailing white space.'
        codingMethod:
          type: integer
          description: 'Method of coding to use for this request.

            '
          format: int32
        allowEmptyStrings:
          type: boolean
          description: "When it is true it allows setting empty string as value for verbatim/translation/transcription/notes fields. \nOtherwise empty string is ignored (i.e. it works like null value). By default it is false."
      additionalProperties: false
      description: A request to add Responses to the specified Question, or to update existing Responses.
    PostResponsesBatchRequest:
      required:
      - questionResponses
      type: object
      properties:
        questionResponses:
          type: array
          items:
            $ref: '#/components/schemas/PostQuestionResponses'
          description: Array of questions with their responses to create
      additionalProperties: false
      description: Request with information for creating multiple responses via one API call (batch operation)
    PostQuestionResponses:
      required:
      - questionKey
      - responses
      type: object
      properties:
        questionKey:
          type: integer
          description: Key of target question
          format: int32
        responses:
          type: array
          items:
            $ref: '#/components/schemas/PostResponseBatch'
          description: Responses
      additionalProperties: false
      description: Question's responses to post
    PutResponsesBatchResult:
      required:
      - questionId
