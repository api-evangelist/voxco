              id: S458-3
              name: Hair care
              description: Test of hair care products
              status: p
              supervisorKey: 44
              clientCompanyKey: 45
              endCompanyKey: 46
              help: Code frames must be spell-checked!
              startDateUtc: '2026-06-13T20:21:47.3196928+00:00'
              dueDateUtc: '2026-06-20T20:21:47.3197193+00:00'
              externalStudyId: null
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewStudyResponse'
              example:
                key: 544
                quota: null
                id: S458-3
                name: Hair care
                description: Test of hair care products
                status: p
                supervisorKey: null
                supervisorAssociateKey: null
                clientCompanyKey: 45
                endCompanyKey: null
                help: Code frames must be spell-checked!
                createDateUtc: '2026-04-29T20:21:47.3117267Z'
                startDateUtc: null
                dueDateUtc: null
                countQuestions: 0
                countResponses: 0
                countResponsesCoded: 0
                countTransactions: 0
                externalStudyId: null
                errorMessage: null
    put:
      tags:
      - Studies
      summary: Update an existing study
      description: Method updates an existing study by using data from request body.
      requestBody:
        description: Information about the Study to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudyRequest'
            example:
              studyKey: 10000
              quota: 3
              id: S458-3
              name: Hair care
              description: Test of hair care products
              status: p
              supervisorKey: 44
              clientCompanyKey: 45
              endCompanyKey: 46
              help: Code frames must be spell-checked!
              startDateUtc: '2026-06-13T20:21:47.3265196+00:00'
              dueDateUtc: '2026-06-20T20:21:47.3265468+00:00'
              externalStudyId: null
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateStudyRequest'
            example:
              studyKey: 10000
              quota: 3
              id: S458-3
              name: Hair care
              description: Test of hair care products
              status: p
              supervisorKey: 44
              clientCompanyKey: 45
