              id: S458-3
              name: Hair care
              description: Test of hair care products
              status: p
              supervisorKey: 44
              clientCompanyKey: 45
              endCompanyKey: 46
              help: Code frames must be spell-checked!
              startDateUtc: '2026-06-13T20:21:47.3265196+00:00'
              dueDateUtc: '2026-06-20T20:21:47.3265468+00:00'
              externalStudyId: null
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStudyResponse'
              example:
                key: 544
                quota: null
                id: S458-3
                name: Hair care
                description: Test of hair care products
                status: p
                supervisorKey: null
                supervisorAssociateKey: null
                clientCompanyKey: 45
                endCompanyKey: null
                help: Code frames must be spell-checked!
                createDateUtc: '2026-04-29T20:21:47.32497Z'
                startDateUtc: null
                dueDateUtc: null
                countQuestions: 0
                countResponses: 0
                countResponsesCoded: 0
                countTransactions: 0
                externalStudyId: null
                errorMessage: null
    delete:
      tags:
      - Studies
      summary: Delete study by key
      description: Method deletes the study by its key.
      requestBody:
        description: Information about the Study to delete.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteStudyRequest'
            example:
              studyKey: 29999
          text/json:
            schema:
              $ref: '#/components/schemas/DeleteStudyRequest'
            example:
              studyKey: 29999
          application/*+json:
            schema:
              $ref: '#/components/schemas/DeleteStudyRequest'
