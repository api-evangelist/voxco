              studyKey: 29999
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteStudyResponse'
              example:
                errorMessage: null
  /Studies/{studyKey}:
    get:
      tags:
      - Studies
      summary: Get a study
      description: Method returns a definition of requested study by using its key.
      parameters:
      - name: studyKey
        in: path
        description: The key of the desired Study, which must be an integer value.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStudyResponse'
              example:
                key: 544
                quota: null
                id: S458-3
                name: Hair care
                description: Test of hair care products
                status: c
                supervisorKey: null
                supervisorAssociateKey: null
                clientCompanyKey: 45
                endCompanyKey: null
                help: Code frames must be spell-checked!
                createDateUtc: '2026-04-29T20:21:47.3332828Z'
                startDateUtc: null
                dueDateUtc: null
                countQuestions: 22
                countResponses: 4968
                countResponsesCoded: 2379
                countTransactions: 2379
