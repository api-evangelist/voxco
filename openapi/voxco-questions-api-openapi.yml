  /Questions/{studyKey}/Batch:
    post:
      tags:
      - Questions
      summary: Creates new questions in the specified study by using one call to API
      description: 'This method expects an array of questions to create in specified study.


        question.type property uses following coding schema:


        c: Closed


        d: Data


        o: Open


        s: Other/Specify


        v: Value


        For example, the value ''so'' (or ''os'') returns Open and Other/Specify Questions.


        question.tasks property uses following coding schema:


        c: Code this Question


        x: Crosstab this Question


        b: Transcribe this Question


        t: Translate this Question


        For example, the value (''ct'' or ''tc'') adjust Question with the Code or Translate tasks set.


        question.codingSource and question.alternativeCodingSource properties use following codes:


        v: Verbatim


        b: Transcription


        t: Translation


        empty string: None'
      parameters:
      - name: studyKey
        in: path
        description: Key of target study
        required: true
