  /Questions/Batch:
    delete:
      tags:
      - Questions
      summary: Deletes specified questions or their items by using one call to API
      description: 'This method expects an array of question keys and entity type.


        Entity type:


        Codes - removes applied codes from questions responses;


        QualityCodes - removes quality codes from questions responses;


        Responses - removes questions responses;


        Question - removes questons;


        Response will contain information about result of operation for each of handled questions.


        If errorMessage is null it means that question/its items succeccfully deleted without error(s).'
      requestBody:
        description: Array of question keys and entity type
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteQuestionsBatchRequest'
            example:
              questionKeys:
              - 200001
              - 2000002
              - 2000003
              entityType: Codes
          text/json:
            schema:
              $ref: '#/components/schemas/DeleteQuestionsBatchRequest'
            example:
              questionKeys:
              - 200001
              - 2000002
              - 2000003
              entityType: Codes
          application/*+json:
            schema:
              $ref: '#/components/schemas/DeleteQuestionsBatchRequest'
            example:
              questionKeys:
              - 200001
              - 2000002
              - 2000003
              entityType: Codes
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DeleteQuestionsBatchResponse'
              example:
                deleteQuestionsBatchResults:
                - questionKey: 200001
                  errorMessage: null
                - questionKey: 200002
                  errorMessage: null
                - questionKey: 200003
                  errorMessage: Some error message
                entityType: Codes
                entityItemsDeleted: 2453
                errorMessage: null
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteQuestionsBatchResponse'
