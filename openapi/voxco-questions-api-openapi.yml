            application/json:
              schema:
                $ref: '#/components/schemas/UpdateQuestionsBatchResponse'
              example:
                failedQuestions:
                - key: '200003'
                  errorMessage: Some error message
                newQuestions: []
                errorMessage: Some questions were not updated. See failedQuestions for details.
            text/json:
              schema:
                $ref: '#/components/schemas/UpdateQuestionsBatchResponse'
              example:
                failedQuestions:
